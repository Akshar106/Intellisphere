<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - IntelliSphere</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .signup-container {
      background: white;
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
    }

    .brand-title {
      text-align: center;
      margin-bottom: 10px;
    }

    .brand-title h1 {
      font-size: 2.5em;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .brand-title p {
      color: #5a6c7d;
      font-size: 0.95em;
      margin-bottom: 35px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 18px;
      color: #667eea;
      font-size: 18px;
      font-weight: bold;
      z-index: 1;
    }

    .input-icon svg {
      width: 22px;
      height: 22px;
      fill: #667eea;
    }

    input {
      width: 100%;
      padding: 16px 18px 16px 50px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input::placeholder {
      color: #adb5bd;
    }

    .signup-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      margin-top: 10px;
    }

    .signup-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .signup-btn:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0;
      color: #5a6c7d;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }

    .divider span {
      padding: 0 15px;
    }

    .oauth-buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .oauth-btn {
      flex: 1;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
      color: #2c3e50;
    }

    .oauth-btn:hover {
      border-color: #667eea;
      background: #f8f9fa;
      transform: translateY(-2px);
    }

    .oauth-btn svg {
      width: 20px;
      height: 20px;
    }

    .login-link {
      text-align: center;
      margin-top: 25px;
      color: #5a6c7d;
      font-size: 15px;
    }

    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .login-link a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    #error-message, #success-message {
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    #error-message {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    #success-message {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }

    #error-message.show, #success-message.show {
      display: block;
    }

    @media (max-width: 480px) {
      .signup-container {
        padding: 40px 30px;
      }

      .oauth-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="brand-title">
      <h1>IntelliSphere</h1>
      <p>Create your account and start exploring</p>
    </div>

    <p id="error-message"></p>
    <p id="success-message"></p>

    <div class="oauth-buttons">
      <button class="oauth-btn" id="google-signup">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button class="oauth-btn" id="github-signup">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#2c3e50">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        GitHub
      </button>
    </div>

    <div class="divider">
      <span>or sign up with email</span>
    </div>

    <form id="signup-form">
      <div class="form-group">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </span>
          <input type="text" id="firstname-input" placeholder="First Name" required>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <span class="input-icon">@</span>
          <input type="email" id="email-input" placeholder="Email address" required>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input type="password" id="password-input" placeholder="Password" required>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input type="password" id="repeat-password-input" placeholder="Confirm Password" required>
        </div>
      </div>

      <button type="submit" class="signup-btn">CREATE ACCOUNT</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="/login">Login</a>
    </div>
  </div>

  <script>
    // OAuth button handlers
    document.getElementById("google-signup").addEventListener("click", function() {
      alert("Google OAuth integration coming soon! This will redirect to Google authentication.");
      // TODO: Implement Google OAuth
      // window.location.href = "/auth/google";
    });

    document.getElementById("github-signup").addEventListener("click", function() {
      alert("GitHub OAuth integration coming soon! This will redirect to GitHub authentication.");
      // TODO: Implement GitHub OAuth
      // window.location.href = "/auth/github";
    });

    // Signup form submission
    document.getElementById("signup-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const firstname = document.getElementById("firstname-input").value.trim();
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;
      const repeatPassword = document.getElementById("repeat-password-input").value;
      const errorMessage = document.getElementById("error-message");
      const successMessage = document.getElementById("success-message");

      errorMessage.className = "";
      successMessage.className = "";
      errorMessage.innerText = "";
      successMessage.innerText = "";

      // Validation
      if (!firstname) {
        errorMessage.className = "show";
        errorMessage.innerText = "First name is required.";
        return;
      }

      if (!email) {
        errorMessage.className = "show";
        errorMessage.innerText = "Email is required.";
        return;
      }

      if (password.length < 8 || !/\d/.test(password) || !/[!@#$%^&*]/.test(password)) {
        errorMessage.className = "show";
        errorMessage.innerText = "Password must be at least 8 characters, contain a number and a special character.";
        return;
      }

      if (password !== repeatPassword) {
        errorMessage.className = "show";
        errorMessage.innerText = "Passwords do not match.";
        return;
      }

      try {
        const response = await fetch("/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ firstname, email, password })
        });

        const data = await response.json();

        if (data.success) {
          successMessage.className = "show";
          successMessage.innerText = "Account created successfully! Redirecting to login...";
          setTimeout(() => {
            window.location.href = "/login";
          }, 2000);
        } else {
          errorMessage.className = "show";
          errorMessage.innerText = data.message;
        }
      } catch (error) {
        errorMessage.className = "show";
        errorMessage.innerText = "Error creating account. Please try again.";
      }
    });
  </script>
</body>
</html>
