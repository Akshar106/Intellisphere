<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - IntelliSphere</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .login-container {
      background: white;
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .logo {
      width: 50px;
      height: 50px;
    }

    .logo-text {
      font-size: 1.8em;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-box {
      text-align: center;
      margin-bottom: 35px;
    }

    .welcome-box h1 {
      font-size: 2em;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .welcome-box p {
      font-size: 0.95em;
      color: #5a6c7d;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 18px;
      color: #667eea;
      font-size: 18px;
      font-weight: bold;
      z-index: 1;
    }

    .input-icon svg {
      width: 22px;
      height: 22px;
      fill: #667eea;
    }

    input {
      width: 100%;
      padding: 16px 18px 16px 50px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input::placeholder {
      color: #adb5bd;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      margin-top: 10px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .signup-link {
      text-align: center;
      margin-top: 25px;
      color: #5a6c7d;
      font-size: 15px;
    }

    .signup-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .signup-link a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    #error-message {
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      display: none;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #error-message.error {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      display: block;
    }

    #error-message.success {
      background: #d1fae5;
      color: #059669;
      border: 1px solid #6ee7b7;
      display: block;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(5px);
    }

    #loading-overlay.show-loading {
      display: flex;
    }

    #loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 40px 30px;
      }

      .welcome-box h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-container">
      <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sphereGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="80" fill="url(#sphereGrad)" opacity="0.2"/>
        <circle cx="100" cy="100" r="60" fill="none" stroke="url(#sphereGrad)" stroke-width="2" opacity="0.4"/>
        <circle cx="100" cy="100" r="45" fill="url(#sphereGrad)"/>
        <text x="100" y="115" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white" text-anchor="middle">i</text>
      </svg>
      <span class="logo-text">IntelliSphere</span>
    </div>

    <div class="welcome-box">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>

    <p id="error-message"></p>

    <form id="login-form">
      <div class="form-group">
        <div class="input-wrapper">
          <span class="input-icon">@</span>
          <input type="email" id="email-input" placeholder="Email address" required>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input type="password" id="password-input" placeholder="Password" required>
        </div>
      </div>

      <button type="submit" class="login-btn">LOGIN</button>
    </form>

    <div class="signup-link">
      New here? <a href="/signup">Create an Account</a>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div id="loading-spinner"></div>
  </div>

  <script>
    // Typewriter effect
    function typeWriter(element, text, delay = 50) {
      let i = 0;
      element.textContent = "";
      function typing() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          setTimeout(typing, delay);
        }
      }
      typing();
    }

    window.onload = function() {
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");

      const titleText = "Welcome Back!";
      const subtitleText = "AI-driven knowledge across multiple domains";

      typeWriter(title, titleText, 80);
      setTimeout(() => {
        typeWriter(subtitle, subtitleText, 40);
      }, titleText.length * 80 + 300);
    };

    // Login form submission
    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;
      const errorMessage = document.getElementById("error-message");
      const loadingOverlay = document.getElementById("loading-overlay");

      // Clear previous messages
      errorMessage.className = "";
      errorMessage.style.display = "none";
      errorMessage.innerText = "";

      // Show loading spinner
      loadingOverlay.classList.add("show-loading");

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        
        // Hide loading spinner
        loadingOverlay.classList.remove("show-loading");

        if (data.success) {
          // Show success message
          errorMessage.className = "success";
          errorMessage.innerText = "✓ Login successful! Redirecting to home...";
          errorMessage.style.display = "block";
          
          // Disable form to prevent double submission
          document.getElementById("login-form").querySelector('button').disabled = true;
          
          // Wait 2 seconds so user can see the success message
          setTimeout(() => {
            window.location.href = "/home";
          }, 2000);
        } else {
          // Show error message from server
          errorMessage.className = "error";
          errorMessage.innerText = data.message || "⚠ Invalid email or password. Please try again.";
          errorMessage.style.display = "block";
          
          // Clear password field for security
          document.getElementById("password-input").value = "";
          document.getElementById("password-input").focus();
        }
      } catch (error) {
        // Hide loading spinner
        loadingOverlay.classList.remove("show-loading");
        
        // Show connection error
        errorMessage.className = "error";
        errorMessage.innerText = "⚠ Connection error. Please check your internet and try again.";
        errorMessage.style.display = "block";
        
        console.error("Login Error:", error);
      }
    });
  </script>
</body>
</html>
