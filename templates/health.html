<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health - IntelliSphere6</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* General styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c3e50;
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 20px 30px;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            background: white;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after, nav a.active::after {
            width: 80%;
        }

        nav a:hover, nav a.active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Session Panel */
        .session-panel {
            width: 280px;
            height: calc(100vh - 80px);
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            position: fixed;
            top: 70px;
            left: 15px;
        }

        .new-session-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .new-session-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        #session-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        #session-list li {
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c3e50;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-weight: 500;
            border: 2px solid transparent;
            position: relative;
        }

        #session-list li:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateX(5px);
        }

        .active-session {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            font-weight: 600;
            border: 2px solid #667eea !important;
        }

        /* Chat Container */
        .chat-container {
            flex-grow: 1;
            max-width: calc(100% - 340px);
            height: calc(100vh - 180px);
            background: white;
            padding: 30px;
            padding-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            margin-left: 320px;
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 100px;
        }

        /* Chat Messages */
        .message {
            word-wrap: break-word;
            max-width: 75%;
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 20px 20px 5px 20px;
            text-align: right;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
            max-width: 70%;
        }

        .ai-message {
            align-self: flex-start;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
            color: #2c3e50;
            padding: 20px 25px;
            border-radius: 20px 20px 20px 5px;
            text-align: justify;
            border-left: 4px solid #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 85%;
            line-height: 1.8;
        }

        .ai-message p {
            margin: 0 0 12px 0;
            text-align: justify;
        }

        .ai-message p:last-child {
            margin-bottom: 0;
        }

        .ai-message ul, .ai-message ol {
            margin: 10px 0;
            padding-left: 25px;
        }

        .ai-message li {
            margin: 8px 0;
            text-align: justify;
        }

        .ai-message h1, .ai-message h2, .ai-message h3, 
        .ai-message h4, .ai-message h5, .ai-message h6 {
            margin: 15px 0 10px 0;
            color: #667eea;
            font-weight: 600;
        }

        .ai-message code {
            background: rgba(102, 126, 234, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .ai-message pre {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .ai-message pre code {
            background: none;
            padding: 0;
            color: #ecf0f1;
        }

        .ai-message blockquote {
            border-left: 3px solid #667eea;
            padding-left: 15px;
            margin: 10px 0;
            font-style: italic;
            color: #555;
        }

        .ai-message strong {
            color: #667eea;
            font-weight: 600;
        }

        .ai-message a {
            color: #667eea;
            text-decoration: none;
            border-bottom: 1px solid #667eea;
            transition: all 0.3s ease;
        }

        .ai-message a:hover {
            color: #764ba2;
            border-bottom-color: #764ba2;
        }

        .ai-message table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }

        .ai-message table th,
        .ai-message table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .ai-message table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .ai-message hr {
            border: none;
            border-top: 2px solid #e0e0e0;
            margin: 15px 0;
        }

        /* Inline Loading Animation */
        .loading-message {
            align-self: flex-start;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
            padding: 15px 20px;
            border-radius: 20px 20px 20px 5px;
            text-align: left;
            border-left: 4px solid #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 75%;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .typing-indicator span {
            color: #667eea;
            font-weight: 500;
            font-size: 15px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dots .dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        /* Bottom Bar (Chat Input) */
        #bottom-bar {
            position: fixed;
            bottom: 10px;
            left: 33px;
            right: 20px;
            display: flex;
            padding: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.1);
            gap: 15px;
            z-index: 100;
        }

        #text-input {
            flex-grow: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        #text-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #text-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #submit-btn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        #submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        #submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        #submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Old loading indicator - hidden */
        #loading-indicator {
            display: none;
        }

        /* Error message styling */
        .ai-message.error {
            background: linear-gradient(135deg, #ffe5e5 0%, #ffd0d0 100%);
            border-left: 4px solid #e74c3c;
            color: #c0392b;
        }

        /* Scrollbar Styling */
        .chat-container::-webkit-scrollbar,
        .session-panel::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track,
        .session-panel::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-container::-webkit-scrollbar-thumb,
        .session-panel::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        /* Menu styles for session items */
        .menu-container {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .menu-button {
            cursor: pointer;
            font-size: 20px;
            padding: 5px 10px;
            color: inherit;
            transition: all 0.3s ease;
        }

        .menu-button:hover {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            min-width: 120px;
        }

        .menu-dropdown.show {
            display: block;
        }

        .menu-dropdown button {
            width: 100%;
            padding: 10px 15px;
            border: none;
            background: none;
            cursor: pointer;
            text-align: left;
            color: #e74c3c;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .menu-dropdown button:hover {
            background: #ffe5e5;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .session-panel {
                position: static;
                width: calc(100% - 40px);
                height: auto;
                margin: 20px;
                max-height: 300px;
            }

            .chat-container {
                margin-left: 20px;
                max-width: calc(100% - 40px);
                height: calc(100vh - 500px);
                margin-bottom: 120px;
            }

            #bottom-bar {
                left: 0px;
                bottom: 10px;
            }

            nav {
                flex-direction: column;
                padding: 10px;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            nav a {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('law') }}">Law</a>
            <a href="{{ url_for('health') }}" class="active">Health</a>
        </div>
    </nav>

    <!-- Session Panel -->
    <div class="session-panel">
        <button id="new-session-btn" class="new-session-btn">➕ New Chat</button>
        <ul id="session-list"></ul>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chat-container"></div>
    
    <div id="loading-indicator">
        <p>Processing your request... Please wait</p>
    </div>
    
    <!-- Bottom Bar for Input -->
    <div id="bottom-bar">
        <input type="text" id="text-input" placeholder="Ask Health related question here...">
        <button id="submit-btn">Send</button>
    </div>

    <script>
        const currentDomain = "{{ domain }}";
        console.log("Current domain:", currentDomain);
    </script>
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
